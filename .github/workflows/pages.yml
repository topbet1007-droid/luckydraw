name: Deploy to GitHub Pages (DISABLED — the site is on Vercel)

# ---------------------------------------------------------------------------
# The live site is hosted on Vercel, which deploys from this repo on every
# push to main and does it in about 30 seconds rather than two or three
# minutes. GitHub Pages has been unpublished.
#
# The `push:` trigger has been removed so this cannot fire on its own. Left
# here, runnable only from the "Run workflow" button, in case Pages is ever
# needed again — re-add the trigger and switch Settings -> Pages back on.
#
# The safety gate moved with the hosting: `node tools/check.mjs` is now
# Vercel's Build Command, so a malformed users.json fails the build and
# Vercel keeps serving the last good version.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:          # "Run workflow" button only — never on push

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                  # a newer push supersedes one still deploying
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The gate. A malformed users.json fails here and the deploy stops, so
      # the site keeps serving the last good copy instead of going blank at
      # 8pm. This is the same check tools/check.mjs runs locally — it should
      # never fail here if it was run before pushing.
      - name: Validate users.json
        run: node tools/check.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "Revealing tonight: \`$(node -e "console.log(JSON.parse(require('fs').readFileSync('users.json','utf8')).names[0])")\`"
            echo ""
            echo "${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
